{% extends "base.html" %}
{% block content %}
<h2>New purchase</h2>
<form method="post">
  <div class="row">
    <div>Supplier
      <select name="supplier_id" required>
        <option value="">-- select --</option>
        {% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div>Bill no <input name="bill_no" required></div>
    <div>Bill date <input type="date" name="bill_date" value="{{ today }}" required></div>
  </div>

  <table class="items">
    <thead>
      <tr><th>Product</th><th>Batch no</th><th>Expiry</th><th>Purchase rate</th><th>Sale rate</th><th>Qty</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <button type="button" class="btn btn-light" id="addRow">+ Add row</button>
  <br><br>
  <button>Save purchase</button>
  <a class="btn btn-light" href="{{ url_for('purchases') }}">Cancel</a>
</form>

<template id="rowTpl">
  <tr>
    <td>
      <select name="product_id" required>
        <option value="">-- select --</option>
        {% for p in products %}<option value="{{ p.id }}">{{ p.name }} ({{ p.pack }})</option>{% endfor %}
      </select>
    </td>
    <td><input name="batch_no" required></td>
    <td><input type="date" name="expiry_date" required></td>
    <td><input type="number" step="0.01" min="0" name="purchase_rate" required></td>
    <td><input type="number" step="0.01" min="0" name="sale_rate" required></td>
    <td><input type="number" min="1" name="qty" required></td>
    <td><button type="button" class="btn btn-light remove">✕</button></td>
  </tr>
</template>

<script>
  const rows = document.getElementById("rows");
  const tpl = document.getElementById("rowTpl");
  function addRow() { rows.appendChild(tpl.content.cloneNode(true)); }
  document.getElementById("addRow").addEventListener("click", addRow);
  rows.addEventListener("click", function (e) {
    if (e.target.classList.contains("remove") && rows.children.length > 1) {
      e.target.closest("tr").remove();
    }
  });
  addRow();
</script>
{% endblock %}
