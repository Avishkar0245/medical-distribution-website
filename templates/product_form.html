{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit' if p.id else 'New' }} product</h2>
<form method="post">
  Name<br><input name="name" value="{{ p.name or '' }}" required><br>
  Company<br><input name="company" value="{{ p.company or '' }}"><br>
  Pack<br><input name="pack" value="{{ p.pack or '' }}"><br>
  HSN<br><input name="hsn" value="{{ p.hsn or '' }}"><br>
  GST %<br><input name="gst_percent" type="number" step="0.01" value="{{ p.gst_percent or '' }}" required><br>
  MRP<br><input name="mrp" type="number" step="0.01" value="{{ p.mrp or '' }}" required><br><br>
  <button>Save</button> <a href="{{ url_for('products') }}">Cancel</a>
</form>
{% endblock %}
